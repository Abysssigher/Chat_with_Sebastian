const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>{let s="";u=new Uint8Array(u);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function derive(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["decrypt"])}
async function open(key,raw){if(document.readyState==="loading")await new Promise(r=>addEventListener("DOMContentLoaded",r));await new Promise(r=>setTimeout(r,0));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
  const html=new TextDecoder().decode(pt).replace("/*__SEBKEY__*/",()=>"window.__SEBK="+JSON.stringify(raw)+";");document.open();document.write(html);document.close()}
async function tryKey(){let s;try{s=localStorage.getItem("sebapp_key")}catch(e){}if(!s)return;
  try{const key=await crypto.subtle.importKey("raw",b64(s),{name:"AES-GCM"},false,["decrypt"]);await open(key,s)}catch(e){try{localStorage.removeItem("sebapp_key")}catch(_){}}}
async function go(){const pw=document.getElementById("p").value;if(!pw)return;const e=document.getElementById("e");e.textContent="……";
  try{const key=await derive(pw);const raw=tob64(await crypto.subtle.exportKey("raw",key));await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
    if(document.getElementById("r").checked){try{localStorage.setItem("sebapp_key",raw)}catch(_){}}await open(key,raw)}
  catch(err){e.textContent="不对。再想想？"}}
document.getElementById("b").onclick=go;document.getElementById("p").onkeydown=ev=>{if(ev.key==="Enter")go()};
if(!window.crypto||!crypto.subtle)document.getElementById("e").textContent="要用 https 打开（GitHub Pages 就是 https）";else tryKey();
</script></body></html>
